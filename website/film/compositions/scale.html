<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #0d1d27; }
    #scale-map { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #scale-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #scale-ring { fill: rgba(244, 241, 234, 0.25); stroke: #f4f1ea; stroke-width: 2; }
    #scale-leader { stroke: #f4f1ea; stroke-width: 2; }
    .tag { font: 500 26px "IBM Plex Mono", monospace; fill: #f4f1ea; paint-order: stroke; stroke: rgba(0, 0, 0, 0.85); stroke-width: 5px; }
    .stat { position: absolute; left: 128px; top: 120px; max-width: 900px; padding: 18px 24px; background: rgba(0, 0, 0, 0.55); color: #f4f1ea; }
    .stat b { display: block; font: 600 72px/1 "Inter", sans-serif; letter-spacing: -0.02em; }
    .stat span { display: block; margin-top: 10px; font: 500 30px/1.3 "Inter", sans-serif; }
    .stat small { display: block; margin-top: 10px; font: 400 18px/1.3 "Inter", sans-serif; color: rgba(244, 241, 234, 0.72); }
    .credit { position: absolute; right: 24px; bottom: 18px; padding: 3px 8px; background: rgba(0, 0, 0, 0.45); color: rgba(244, 241, 234, 0.75); font: 400 16px "Inter", sans-serif; }
  </style>
  <div id="root" data-composition-id="scale" data-width="1920" data-height="1080">
    <video id="scale-map" class="clip" src="assets/map/gulf.mp4" data-start="0" data-duration="9.5" muted playsinline></video>
    <svg id="scale-svg" class="clip" data-start="5.9" data-duration="3.6" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <circle id="scale-ring" r="11" />
      <line id="scale-leader" />
      <text id="scale-tag" class="tag">what one patrol boat can see</text>
    </svg>
    <div id="scale-stat" class="stat clip" data-start="1.2" data-duration="4.4">
      <b>3 in 4</b>
      <span>industrial fishing vessels are not publicly tracked</span>
      <small>72–76 % worldwide, 2017–2021 · Paolo et al., Nature 625 (2024)</small>
    </div>
    <div id="scale-credit" class="credit clip" data-start="0" data-duration="9.5" data-layout-ignore>Imagery: Esri, Maxar, Earthstar Geographics</div>
  </div>
  <script>
    const proj = (c, z) => {
      const W = 512 * 2 ** z;
      const mx = (lon) => ((lon + 180) / 360) * W;
      const my = (lat) => { const s = Math.sin((lat * Math.PI) / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * W; };
      const cx = mx(c[0]), cy = my(c[1]);
      return (lon, lat) => [mx(lon) - cx + 960, my(lat) - cy + 540];
    };
    // The bake holds at zoom 6.3 on the same centre as the coast shot.
    const P = proj([55.06, 25.0103], 6.3);
    const [x, y] = P(54.817, 25.153);
    const pxPerKm = (512 * 2 ** 6.3) / 360 / (111.32 * Math.cos((25.15 * Math.PI) / 180));
    const ring = document.getElementById("scale-ring");
    ring.setAttribute("cx", x.toFixed(1)); ring.setAttribute("cy", y.toFixed(1));
    ring.setAttribute("r", Math.max(6, 10 * pxPerKm).toFixed(1)); // a 10 km radius
    const lead = document.getElementById("scale-leader");
    lead.setAttribute("x1", x - 10); lead.setAttribute("y1", y - 10);
    lead.setAttribute("x2", x - 120); lead.setAttribute("y2", y - 120);
    const tag = document.getElementById("scale-tag");
    tag.setAttribute("x", x - 128); tag.setAttribute("y", y - 132); tag.setAttribute("text-anchor", "end");

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#scale-stat", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.2)
      .to("#scale-stat", { opacity: 0, duration: 0.3 }, 5.25)
      .fromTo("#scale-ring", { opacity: 0, attr: { r: 60 } }, { opacity: 1, attr: { r: Math.max(6, 10 * pxPerKm) }, duration: 0.5, ease: "power2.out" }, 5.9)
      .fromTo(["#scale-leader", "#scale-tag"], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 6.3);
    window.__timelines["scale"] = tl;
  </script>
</template>
