[project]
name = "seas-of-data-dashboard"
version = "0.1.0"
description = "Monitoring dashboard for Sentinel-1 ship and dark-vessel detections"
requires-python = "==3.12.*"
dependencies = [
    "jsonschema[format-nongpl]>=4.23",
    "pandas>=2.2",
    "pillow>=13.0.0",
    "plotly>=5.24",
    "pydeck>=0.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
